name: Unpack website ZIP

on:
  push:
    branches: [main]
    paths:
      - 'C4_web_2026-09-17_v9_speed.zip'
      - '.github/workflows/unpack-site.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website
        shell: bash
        run: |
          set -euo pipefail
          ZIP='C4_web_2026-09-17_v9_speed.zip'
          if [ ! -f "$ZIP" ]; then
            echo 'ZIP already unpacked; nothing to do.'
            exit 0
          fi
          unzip -o "$ZIP" -d .
          rm "$ZIP"

      - name: Commit unpacked website
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unpack optimized Citroën C4 website'
          git push
