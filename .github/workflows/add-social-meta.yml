name: Add social preview metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-social-meta.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Open Graph and social metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'property="og:image"' not in s:
              needle = '  <meta name="description" content="2005-ös Citroën C4 2.0i 16V Exclusive, 138 LE, megközelítőleg 185 000 km. Jelenleg nem indítható, saját elszállítással eladó Érden.">\n'
              social = '''  <meta property="og:locale" content="hu_HU">\n  <meta property="og:type" content="website">\n  <meta property="og:title" content="Citroën C4 2.0i Exclusive ELADÓ · JZV-662">\n  <meta property="og:description" content="2005-ös Citroën C4 2.0i 16V Exclusive, 138 LE, megközelítőleg 185 000 km. Jelenleg nem indítható, saját elszállítással eladó Érden.">\n  <meta property="og:url" content="https://hasznaltcitroen.hu/">\n  <meta property="og:image" content="https://hasznaltcitroen.hu/images/social-preview.jpg">\n  <meta property="og:image:secure_url" content="https://hasznaltcitroen.hu/images/social-preview.jpg">\n  <meta property="og:image:type" content="image/jpeg">\n  <meta property="og:image:width" content="1200">\n  <meta property="og:image:height" content="630">\n  <meta property="og:image:alt" content="Citroën C4 2.0i Exclusive ELADÓ · JZV-662">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="Citroën C4 2.0i Exclusive ELADÓ · JZV-662">\n  <meta name="twitter:description" content="2005-ös Citroën C4 2.0i 16V Exclusive, 138 LE, megközelítőleg 185 000 km. Jelenleg nem indítható, saját elszállítással eladó Érden.">\n  <meta name="twitter:image" content="https://hasznaltcitroen.hu/images/social-preview.jpg">\n'''
              if needle not in s:
                  raise SystemExit('Description meta tag not found')
              s = s.replace(needle, needle + social, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-social-meta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add social media preview metadata'
          git push
