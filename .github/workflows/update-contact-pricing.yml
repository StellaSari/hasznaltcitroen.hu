name: Update pricing and contact copy

on:
  push:
    paths:
      - '.github/workflows/update-contact-pricing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update price and contact copy
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '''    /* 2026-09-17: hero quick facts visibility fix */\n    .hero .fact strong { color: var(--ink); }\n'''
          css_new = css_anchor + '''\n    /* 2026-09-17: pricing and low-friction contact */\n    .old-price {\n      display:block;\n      margin:18px 0 5px;\n      font-size:1.15rem;\n      font-weight:800;\n      color:#5e5f50;\n      text-decoration:line-through;\n      text-decoration-thickness:2px;\n    }\n    .current-price-label {\n      display:block;\n      margin-bottom:7px;\n      font-size:.78rem;\n      font-weight:850;\n      letter-spacing:.08em;\n      text-transform:uppercase;\n    }\n    .contact-links {\n      display:flex;\n      flex-direction:column;\n      align-items:flex-start;\n      gap:10px;\n      margin-top:28px;\n    }\n    .contact-links a {\n      font-weight:900;\n      text-decoration:none;\n      color:var(--ink);\n    }\n    .contact-links a:hover { text-decoration:underline; text-underline-offset:5px; }\n    .cta .contact-links a { color:white; }\n'''
          if css_anchor in s and 'pricing and low-friction contact' not in s:
              s = s.replace(css_anchor, css_new, 1)

          old_hero = '''          <aside class="offer-card">\n            <div>\n              <span class="label">Vételár</span>\n              <div class="price">250 000 Ft</div>\n              <p>A vevő által megszervezett és fizetett elszállítással. Utólagos szállítási levonás nélkül.</p>\n            </div>\n            <a class="button" href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%ADr%C3%A1sos%20aj%C3%A1nlat">Írásos ajánlatot teszek</a>\n            <a class="hero-phone" href="tel:+36304653834">06 30 465 3834</a>\n          </aside>'''
          new_hero = '''          <aside class="offer-card">\n            <div>\n              <span class="label">Vételár</span>\n              <span class="old-price">390 000 Ft</span>\n              <span class="current-price-label">Most</span>\n              <div class="price">250 000 Ft</div>\n              <p>A vevő által megszervezett és fizetett elszállítással. Utólagos szállítási levonás nélkül.</p>\n            </div>\n            <div class="contact-links" aria-label="Kapcsolat">\n              <a href="tel:+36304653834">06 30 465 3834</a>\n              <a href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%A9rdekl%C5%91d%C3%A9s">Email küldése</a>\n            </div>\n          </aside>'''
          if old_hero not in s:
              raise SystemExit('Hero contact block not found')
          s = s.replace(old_hero, new_hero, 1)

          old_step = '''          <article class="step"><span class="num">01</span><h3>Írásos ajánlat</h3><p>A vevő megjelöli a ténylegesen fizetendő vételárat és visszaigazolja, hogy az elszállítást saját költségén szervezi.</p></article>'''
          new_step = '''          <article class="step"><span class="num">01</span><h3>Érdeklődés</h3><p>Telefonon vagy emailben tud érdeklődni az autóról és megtekintési időpontot egyeztetni.</p></article>'''
          if old_step in s:
              s = s.replace(old_step, new_step, 1)

          old_cta = '''        <div class="cta-panel">\n          <h2>Lát lehetőséget az autóban? Várom ajánlatát.</h2>\n          <p>Kérem, ajánlatában írja meg a ténylegesen fizetendő vételárat, a megtekintés tervezett időpontját, és azt, hogy az elszállítást saját költségén vállalja.</p>\n          <a class="button" href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%ADr%C3%A1sos%20aj%C3%A1nlat&body=Aj%C3%A1nlott%20v%C3%A9tel%C3%A1r%3A%0AMegtekint%C3%A9s%20tervezett%20ideje%3A%0ASaj%C3%A1t%20k%C3%B6lts%C3%A9g%C5%B1%20elsz%C3%A1ll%C3%ADt%C3%A1st%20v%C3%A1llalom%3A%20igen%2Fnem">Ajánlat küldése emailben</a>\n        </div>'''
          new_cta = '''        <div class="cta-panel">\n          <h2>Érdekli az autó? Itt tud érdeklődni.</h2>\n          <p>Kérdés esetén hívjon vagy küldjön emailt. A megtekintés előre egyeztetett időpontban lehetséges. Az elszállítást a vevő szervezi és fizeti.</p>\n          <div class="contact-links" aria-label="Kapcsolat">\n            <a href="tel:+36304653834">06 30 465 3834</a>\n            <a href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%A9rdekl%C5%91d%C3%A9s">Email küldése</a>\n          </div>\n        </div>'''
          if old_cta not in s:
              raise SystemExit('Lower CTA block not found')
          s = s.replace(old_cta, new_cta, 1)

          old_footer = '''      <div><span class="footer-label">Kapcsolat</span><a href="tel:+36304653834">06 30 465 3834</a><br><a href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%ADr%C3%A1sos%20aj%C3%A1nlat">eszter.pasztor@proton.me</a></div>'''
          new_footer = '''      <div><span class="footer-label">Kapcsolat</span><a href="tel:+36304653834">06 30 465 3834</a><br><a href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%A9rdekl%C5%91d%C3%A9s">Email küldése</a></div>'''
          if old_footer in s:
              s = s.replace(old_footer, new_footer, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/update-contact-pricing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-contact-pricing.yml
          git commit -m "Update pricing and simplify contact flow"
          git push
