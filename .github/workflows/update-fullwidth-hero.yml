name: Update full-width hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-fullwidth-hero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make lamp photo the full-width hero
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update_hero.py
          python /tmp/update_hero.py

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-fullwidth-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use lamp photo as full-width opening hero'
          git push
