name: Remove sale label

on:
  push:
    paths:
      - '.github/workflows/remove-sale-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove sale label
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('              <span class="current-price-label">Akciósan</span>\n', '')
          s = s.replace('          <span class="current-price-label">Akciósan</span>\n', '')
          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/remove-sale-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-sale-label.yml
          git commit -m "Remove sale label from pricing panels"
          git push
