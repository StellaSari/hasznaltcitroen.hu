name: Simplify price panels

on:
  push:
    paths:
      - '.github/workflows/simplify-price-panels.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Simplify top and bottom pricing panels
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '''    .cta .contact-links a { color:white; }\n'''
          css_new = css_anchor + '''\n    /* 2026-09-17: simplified sales price panels */\n    .offer-card {\n      text-align:center;\n      align-items:center;\n      justify-content:center;\n      gap:28px;\n    }\n    .offer-card > div:first-child { width:100%; }\n    .offer-card .label,\n    .price-cta .label {\n      display:block;\n      margin-bottom:14px;\n      font-family:var(--text);\n      font-size:.8rem;\n      font-weight:600;\n      letter-spacing:.10em;\n      text-transform:uppercase;\n    }\n    .old-price {\n      display:block;\n      margin:0;\n      font-family:var(--text);\n      font-size:clamp(3rem,6vw,5.5rem);\n      font-weight:700;\n      line-height:.95;\n      letter-spacing:-.055em;\n      text-align:center;\n      text-decoration-line:line-through;\n      text-decoration-thickness:3px;\n      text-decoration-color:currentColor;\n    }\n    .current-price-label {\n      display:block;\n      margin:24px 0 4px;\n      font-family:var(--text);\n      font-size:.88rem;\n      font-weight:500;\n      letter-spacing:.08em;\n      text-transform:uppercase;\n      text-align:center;\n    }\n    .offer-card .price,\n    .price-cta .price {\n      margin:0;\n      font-family:var(--text);\n      font-size:clamp(2.7rem,5.4vw,4.8rem);\n      font-weight:700;\n      line-height:1;\n      letter-spacing:-.05em;\n      text-align:center;\n    }\n    .offer-card .contact-links,\n    .price-cta .contact-links {\n      width:100%;\n      align-items:center;\n      margin-top:10px;\n      gap:12px;\n      text-align:center;\n    }\n    .offer-card .contact-links a,\n    .price-cta .contact-links a {\n      font-family:var(--text);\n      font-size:clamp(1.15rem,2vw,1.45rem);\n      font-weight:400;\n      letter-spacing:.02em;\n    }\n    .price-cta {\n      text-align:center;\n      display:flex;\n      flex-direction:column;\n      align-items:center;\n      justify-content:center;\n      min-height:430px;\n    }\n    .price-cta .old-price,\n    .price-cta .current-price-label,\n    .price-cta .price { color:white; }\n    .price-cta .label { color:rgba(255,255,255,.86); }\n    @media (max-width:620px) {\n      .price-cta { min-height:360px; }\n    }\n'''
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          if 'simplified sales price panels' not in s:
              s = s.replace(css_anchor, css_new, 1)

          old_hero = '''          <aside class="offer-card">\n            <div>\n              <span class="label">Vételár</span>\n              <span class="old-price">390 000 Ft</span>\n              <span class="current-price-label">Most</span>\n              <div class="price">250 000 Ft</div>\n              <p>A vevő által megszervezett és fizetett elszállítással. Utólagos szállítási levonás nélkül.</p>\n            </div>\n            <div class="contact-links" aria-label="Kapcsolat">\n              <a href="tel:+36304653834">06 30 465 3834</a>\n              <a href="#" class="email-link">Email küldése</a>\n            </div>\n          </aside>'''
          new_hero = '''          <aside class="offer-card">\n            <div>\n              <span class="label">Vételár</span>\n              <span class="old-price">390 000 Ft</span>\n              <span class="current-price-label">Akciósan</span>\n              <div class="price">250 000 Ft</div>\n            </div>\n            <div class="contact-links" aria-label="Kapcsolat">\n              <a href="tel:+36304653834">06 30 465 3834</a>\n              <a href="#" class="email-link">Email küldése</a>\n            </div>\n          </aside>'''
          if old_hero not in s:
              raise SystemExit('Top price panel not found')
          s = s.replace(old_hero, new_hero, 1)

          old_cta = '''        <div class="cta-panel">\n          <h2>Érdekli az autó? Itt tud érdeklődni.</h2>\n          <p>Kérdés esetén hívjon vagy küldjön emailt. A megtekintés előre egyeztetett időpontban lehetséges. Az elszállítást a vevő szervezi és fizeti.</p>\n          <div class="contact-links" aria-label="Kapcsolat">\n            <a href="tel:+36304653834">06 30 465 3834</a>\n            <a href="#" class="email-link">Email küldése</a>\n          </div>\n        </div>'''
          new_cta = '''        <div class="cta-panel price-cta">\n          <span class="label">Vételár</span>\n          <span class="old-price">390 000 Ft</span>\n          <span class="current-price-label">Akciósan</span>\n          <div class="price">250 000 Ft</div>\n          <div class="contact-links" aria-label="Kapcsolat">\n            <a href="tel:+36304653834">06 30 465 3834</a>\n            <a href="#" class="email-link">Email küldése</a>\n          </div>\n        </div>'''
          if old_cta not in s:
              raise SystemExit('Bottom price panel not found')
          s = s.replace(old_cta, new_cta, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/simplify-price-panels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/simplify-price-panels.yml
          git commit -m "Simplify pricing panels and center contact details"
          git push
