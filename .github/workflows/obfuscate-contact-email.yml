name: Obfuscate contact email

on:
  push:
    paths:
      - '.github/workflows/obfuscate-contact-email.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove plain-text email from HTML
        shell: python
        run: |
          from pathlib import Path

          js = '''\n  <script>\n    document.querySelectorAll('.email-link').forEach(function(link) {\n      link.addEventListener('click', function(event) {\n        event.preventDefault();\n        const codes = [101,115,122,116,101,114,46,112,97,115,122,116,111,114,64,112,114,111,116,111,110,46,109,101];\n        const address = String.fromCharCode.apply(null, codes);\n        window.location.href = 'mailto:' + address + '?subject=' + encodeURIComponent('JZV-662 érdeklődés');\n      });\n    });\n  </script>\n'''

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          plain = 'href="mailto:eszter.pasztor@proton.me?subject=JZV-662%20%C3%A9rdekl%C5%91d%C3%A9s"'
          s = s.replace(plain, 'href="#" class="email-link"')
          if 'const codes = [101,115,122,116,101,114' not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')

          p = Path('adatvedelem.html')
          s = p.read_text(encoding='utf-8')
          old = 'Kapcsolati e-mail: <a href="mailto:eszter.pasztor@proton.me">eszter.pasztor@proton.me</a>.'
          new = 'Kapcsolati e-mail: <a href="#" class="email-link">Email küldése</a>.'
          if old in s:
              s = s.replace(old, new)
          if 'const codes = [101,115,122,116,101,114' not in s:
              s = s.replace('</body>', js + '</body>')
          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/obfuscate-contact-email.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html adatvedelem.html .github/workflows/obfuscate-contact-email.yml
          git commit -m "Hide contact email from page source"
          git push
