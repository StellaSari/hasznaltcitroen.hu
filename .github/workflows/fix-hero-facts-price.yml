name: Fix hero facts and price

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hero-facts-price.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix quick facts visibility and lower price
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('390 000 Ft', '250 000 Ft')

          marker = '/* 2026-09-17: hero quick facts visibility fix */'
          css = '''\n    /* 2026-09-17: hero quick facts visibility fix */\n    .hero .fact strong { color: var(--ink); }\n'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-hero-facts-price.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix hero quick facts and update price to 250000 Ft'
          git push
